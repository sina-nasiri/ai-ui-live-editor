name: Feature request
description: Suggest something the editor should be able to do
labels: [enhancement]

body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >
        Describe the workflow, not the feature. "I need to show three button
        options to a research participant" tells us more than "add a variants
        panel" — and often there is a simpler answer.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What did you have in mind?

  - type: dropdown
    id: audience
    attributes:
      label: Who is this for?
      options:
        - UX research
        - UI / visual design
        - Product / stakeholder review
        - Front-end development
        - Accessibility
        - Other
